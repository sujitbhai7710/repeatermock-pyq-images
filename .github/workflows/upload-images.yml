name: Upload PYQ Images

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upload-images
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install httpx

      - name: Upload images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: python3 upload_images.py

      - name: Commit progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add upload_progress.json 2>/dev/null || true
          git commit -m "progress: $(date -u '+%Y-%m-%d %H:%M UTC')" 2>/dev/null || echo "Nothing to commit"
          git push origin HEAD 2>/dev/null || echo "Push skipped"
          exit 0

      - name: Trigger next run if needed
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          TOTAL=75493
          UPLOADED=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/git/trees/main?recursive=1" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(1 for t in d.get('tree',[]) if t['path'].endswith('.png') and t['type']=='blob'))" 2>/dev/null || echo 0)
          echo "Images: $UPLOADED / $TOTAL"
          if [ "$UPLOADED" -lt "$TOTAL" ]; then
            echo "Triggering next run..."
            sleep 60
            curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/upload-images.yml/dispatches" \
              -d '{"ref":"main"}' -w "\nTrigger: %{http_code}\n"
          else
            echo "All images uploaded!"
          fi
          exit 0
